name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installazione dipendenze
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Login a GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immagine Docker
        if: github.event_name == 'pull_request'
        run: docker build -t reach17:${{ github.sha }} .

      - name: Build e push immagine Docker su GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/marcosar1991/reach17:${{ github.sha }}