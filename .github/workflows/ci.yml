name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installazione dipendenze
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build immagine Docker
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: reach17:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login a GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push immagine Docker su GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/marcosar1991/reach17:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy su Staging
        run: |
          curl -fsS -X POST \
            "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}&imgURL=ghcr.io%2Fmarcosar1991%2Freach17%3A${{ github.sha }}"

      - name: Smoke test Staging
        run: |
          sleep 45
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-delay 10 \
            "${{ vars.STAGING_URL }}"

  deploy-production:
    if: github.event_name == 'push'
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy su Production
        run: |
          curl -fsS -X POST \
            "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}&imgURL=ghcr.io%2Fmarcosar1991%2Freach17%3A${{ github.sha }}"

      - name: Smoke test Production
        run: |
          sleep 45
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-delay 10 \
            "${{ vars.PRODUCTION_URL }}"
